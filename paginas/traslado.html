<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Traslados</title>
    <link rel="stylesheet" href="../css/trasladoE.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />


</head>

<body>

    <header id="encabezado">
        <h1>traslados</h1>
    </header>

    <main id="central">

        <article id="registrar">
            <button id="ingresarO">Ingresar Origen</button>
            <input type="text" id="lat" name="lat">
            <input type="text" name="" id="lng">

            <br><br>

            <label for="departament">Seleciona Departamento:</label>
            <select id="departamento">
                <option value="">-- Elegí departamento --</option>
                <option value="Montevideo">Montevideo</option>
                <option value="Canelones">Canelones</option>
                <option value="Maldonado">Maldonado</option>
                <option value="Salto">Salto</option>
                <option value="Paysandú">Paysandú</option>
                <option value="Rivera">Rivera</option>
                <option value="Tacuarembó">Tacuarembó</option>
                <option value="Artigas">Artigas</option>
                <option value="Cerro Largo">Cerro Largo</option>
                <option value="Durazno">Durazno</option>
                <option value="Flores">Flores</option>
                <option value="Florida">Florida</option>
                <option value="Lavalleja">Lavalleja</option>
                <option value="Río Negro">Río Negro</option>
                <option value="Rocha">Rocha</option>
                <option value="Soriano">Soriano</option>
                <option value="San José">San José</option>
                <option value="Treinta y Tres">Treinta y Tres</option>
                <option value="Colonia">Colonia</option>
            </select>

            <br><br>

            <label for="dir">Ingrese Dirección:</label>
            <input type="text" id="dir" name="dir">

            <button id="ubicar">Ubicar</button>
            
            <br><br>

            <button id="rutear">Rutear</button>
        </article>

        <article id="listar">

        </article>

        <article id="visualizar">

        </article>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/mapa.js"></script>

</body>

</html>
