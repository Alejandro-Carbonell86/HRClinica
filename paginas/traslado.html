<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Traslados</title>
    <link rel="stylesheet" href="../css/trasladoE.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />


</head>

<body>

    <header id="encabezado">
        <h1>traslados</h1>
    </header>

    <main id="central">

        <article id="registrar">
            <form id="formularioTraslado">
            <button type="button" id="ingresarO">Ingresar Origen</button>
            <label for="lat">Latitud de origen:</label>
            <input type="text" id="lat" name="lat" readonly>
            <label for="lng">Longitud de origen:</label>
            <input type="text" id="lng" name="lng" readonly>

            <br><br>

            <label for="departamento">Selecciona departamento:</label>
            <select id="departamento">
                <option value="">-- Elegí departamento --</option>
                <option value="Montevideo">Montevideo</option>
                <option value="Canelones">Canelones</option>
                <option value="Maldonado">Maldonado</option>
                <option value="Salto">Salto</option>
                <option value="Paysandú">Paysandú</option>
                <option value="Rivera">Rivera</option>
                <option value="Tacuarembó">Tacuarembó</option>
                <option value="Artigas">Artigas</option>
                <option value="Cerro Largo">Cerro Largo</option>
                <option value="Durazno">Durazno</option>
                <option value="Flores">Flores</option>
                <option value="Florida">Florida</option>
                <option value="Lavalleja">Lavalleja</option>
                <option value="Río Negro">Río Negro</option>
                <option value="Rocha">Rocha</option>
                <option value="Soriano">Soriano</option>
                <option value="San José">San José</option>
                <option value="Treinta y Tres">Treinta y Tres</option>
                <option value="Colonia">Colonia</option>
            </select>

            <br><br>

            <label for="dir">Ingrese Dirección:</label>
            <input type="text" id="dir" name="dir">

            <button type="button" id="ubicar">Ubicar y rutear</button>

            <label for="fechaSalida">Fecha y hora de salida:</label>
            <input type="datetime-local" id="fechaSalida" required>

            <label for="ambulancia">Ambulancia:</label>
            <select id="ambulancia" required></select>

            <label for="conductor">Conductor / chofer:</label>
            <select id="conductor" required></select>

            <label for="copiloto">Copiloto:</label>
            <select id="copiloto"></select>

            <label for="elemento">Elemento del traslado:</label>
            <select id="elemento"></select>

            <label for="observaciones">Observaciones:</label>
            <textarea id="observaciones"></textarea>

            <button type="submit" id="guardarTraslado">Guardar traslado</button>
            <p id="mensajeTraslado"></p>
            </form>
        </article>

        <article id="listar">
            <h2>Traslados registrados</h2>
            <p id="mensajeLista" role="status"></p>
            <div id="listaTraslados"></div>
        </article>

        <article id="visualizar">

        </article>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/mapa.js"></script>
    <script src="../js/traslados.js"></script>

</body>

</html>
