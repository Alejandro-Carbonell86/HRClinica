<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargar Documento</title>
    <link rel="stylesheet" href="../css/estilosDOC.css">
</head>

<body>
    <header>
        <h1>Cargar Documento</h1>
    </header>
    <main class="contenedor-principal">
        <section class="seccion-izquierda">
            <h2 class="titulo-seccion">Subir documento</h2>
            <form id="formularioCarga">
                <label for="nombre_archivo">Nombre del documento:</label>
                <input type="text" id="nombre_archivo" name="nombre" required>

                <label for="documento">Seleccionar archivo:</label>
                <input type="file" id="documento" name="archivo" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" required>

                <button type="submit" id="carga_documento">Subir documento</button>
            </form>
            <div id="mensaje" role="status" aria-live="polite"></div>
        </section>

        <hr class="separador-movil">

        <section class="seccion-derecha">
            <h2 class="titulo-seccion">Documentos guardados</h2>
            <p id="mensajeLista" role="status" aria-live="polite"></p>
            <div id="listaDoc"></div>
        </section>
    </main>

    <section id="zonaImpresion" aria-hidden="true">
        <h1 id="tituloImpresion"></h1>
        <div id="qrImpresion"></div>
        <p id="urlImpresion"></p>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="../js/cargar.js"></script>
</body>

</html>
