<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Funcionario</title>
    <link rel="stylesheet" href="/css/estilosUS.css">
</head>
<body>
    <main id="registro">

        <h1>Registro de Usuarios de Sistema</h1>

        <form id="formularioRegistro">
            
            <label for="nombreU">Usuario:</label>
            <input type="text" id="nombreU" name="nombreU">

            <label for="contrasenia">Contraseña:</label>
            <input type="password" id="contrasenia" name="contrasenia">

            <label for="nombreC">Nombre Completo:</label>
            <input type="text" id="nombreC" name="nombreC">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">

            <label for="rol">Seleccione Rol:</label>
            <select name="rol" id="rol">
                <option value="administrador">Administrador</option>
            </select>

            <label for="numeroId">Ingrese Número de Empleado: </label>
            <input type="number" id="numeroId" name="numeroId">

            <input type="submit" id="boton" name="boton" value="Registrar">

        </form>

        <a href="/index.html">Volver</a>
    </main>
    <script src="/js/usuariosSistema.js"></script>
</body>
</html>
