<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambulancia</title>
</head>
<body>
    <form id="ambulancia">

        <label for="matricula">Matricula: </label>
        <input type="text" id="matricula" name="matricula">

        <label for="modelo">Modelo: </label>
        <input type="text" name="modelo" id="modelo">

        <label for="marca">Marca: </label>
        <input type="text" id="marca" name="marca">

        <label for="ano">Año: </label>
        <input type="number" id="ano" name="ano">

        <label for="tipo">Tipo: </label>
        <select name="tipo" id="tipo">
            <option value="basica">Básica</option>
            <option value="medicalizada">Medicalizada</option>
            <option value="uti_movil">UTI Móvil</option>
        </select>

        <label for="capacidad">Capacidad: </label>
        <input type="number" id="capacidad" name="capacidad">

        <label for="fecha">Fecha de Último Mantenimiento:</label>
        <input type="date" name="fecha" id="fecha">

        <input type="submit" id="boton" name="boton">

    </form>

    <script src="../js/ambulancia.js"></script>
</body>
</html>
