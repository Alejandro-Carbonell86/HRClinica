<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Copiloto</title>
    <link rel="stylesheet" href="../css/estilosUS.css">
</head>
<body>
    <main id="registro">

        <h1>Registro de Copilotos</h1>

        <form id="formularioCopiloto">

            <label for="documento">Documento:</label>
            <input type="text" id="documento" name="documento">

            <label for="nombreC">Nombre Completo:</label>
            <input type="text" id="nombreC" name="nombreC">

            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" name="telefono">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">

            <label for="fechaContratacion">Fecha de Contratación:</label>
            <input type="date" id="fechaContratacion" name="fechaContratacion">

            <input type="submit" id="boton" name="boton" value="Registrar">

        </form>

        <a href="../index.html">Volver</a>
    </main>
    <script src="../js/copilotos.js"></script>
</body>
</html>
